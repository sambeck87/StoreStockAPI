default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: store_stock_api_development

test:
  <<: *default
  database: store_stock_api_test

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>
