default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "" } %>
  password: <%= ENV["STORE_STOCK_API_DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: store_stock_api_development

test:
  <<: *default
  database: store_stock_api_test

production:
  <<: *default
  database: store_stock_api_production
  username: <%= ENV["STORE_STOCK_API_DATABASE_USERNAME"] %>
  password: <%= ENV["STORE_STOCK_API_DATABASE_PASSWORD"] %>
